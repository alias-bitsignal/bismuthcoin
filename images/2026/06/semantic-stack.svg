<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
  <rect width="1200" height="720" rx="28" fill="#f7f9fc"/>
  <text x="60" y="70" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="800" fill="#182033">The core architectural idea: data first, meaning above it</text>
  <text x="60" y="110" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#596275">Bismuth's operation/openfield model lets ordinary transactions carry application semantics.</text>
  <rect x="90" y="170" width="1020" height="95" rx="22" fill="#ffffff" stroke="#5fa1ee" stroke-width="3"/>
  <circle cx="132" cy="218" r="22" fill="#5fa1ee" opacity="0.16"/><circle cx="132" cy="218" r="8" fill="#5fa1ee"/>
  <text x="172" y="210" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#182033">Base chain consensus</text>
  <text x="172" y="240" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#596275">Transactions are ordered and secured by proof-of-work.</text>
  <path d="M 600 265 L 600 296" stroke="#b364c2" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="150" y="295" width="900" height="95" rx="22" fill="#ffffff" stroke="#b364c2" stroke-width="3"/>
  <circle cx="192" cy="343" r="22" fill="#b364c2" opacity="0.16"/><circle cx="192" cy="343" r="8" fill="#b364c2"/>
  <text x="232" y="335" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#182033">Operation + openfield data</text>
  <text x="232" y="365" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#596275">Application intent is encoded as data on normal transactions.</text>
  <path d="M 600 390 L 600 421" stroke="#5fa1ee" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="210" y="420" width="780" height="95" rx="22" fill="#ffffff" stroke="#5fa1ee" stroke-width="3"/>
  <circle cx="252" cy="468" r="22" fill="#5fa1ee" opacity="0.16"/><circle cx="252" cy="468" r="8" fill="#5fa1ee"/>
  <text x="292" y="460" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#182033">Plugins, wallets, explorers, indexers</text>
  <text x="292" y="490" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#596275">Replaceable interpreters compute balances, names, posts, events, or app state.</text>
  <path d="M 600 515 L 600 546" stroke="#b364c2" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="230" y="545" width="740" height="115" rx="22" fill="#ffffff" stroke="#b364c2" stroke-width="3"/>
  <circle cx="272" cy="598" r="22" fill="#b364c2" opacity="0.16"/><circle cx="272" cy="598" r="8" fill="#b364c2"/>
  <text x="312" y="587" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#182033">Canonical meaning when value is at stake</text>
  <text x="312" y="617" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#596275">If interpretation determines ownership or balances,</text>
  <text x="312" y="641" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#596275">the ecosystem must converge on one engine.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b364c2"/>
    </marker>
  </defs>
</svg>