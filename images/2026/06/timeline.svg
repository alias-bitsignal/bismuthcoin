  <text x="32" y="382" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#596275">Mainnet launches on 1</text>
  <text x="32" y="404" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#596275">May with no ICO and no</text>
  <text x="32" y="426" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#596275">premine. PID</text>
  <text x="32" y="448" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#596275">difficulty research</text>

