  <text x="504" y="382" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#596275">Shielded tokens and</text>
  <text x="504" y="404" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#596275">the first formal</text>
  <text x="504" y="426" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#596275">Bismuth governance</text>
  <text x="504" y="448" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#596275">vote.</text>

