  <text x="976" y="426" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#596275">state-machine</text>
  <text x="976" y="448" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#596275">programmability.</text>

