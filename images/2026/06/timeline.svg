  <text x="740" y="452" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#596275">Condition, Android</text>
  <text x="740" y="474" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#596275">battery, and Tesla</text>
  <text x="740" y="496" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#596275">battery monitoring</text>
  <text x="740" y="518" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#596275">on-chain.</text>

