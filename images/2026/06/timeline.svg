  <rect x="1194" y="350" width="192" height="190" rx="18" fill="#ffffff" stroke="#d9e1ee"/>
  <text x="1212" y="390" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#b364c2">2026</text>
  <text x="1212" y="420" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#182033">Modernisation</text>
  <text x="1212" y="452" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#596275">Canonical transaction</text>
  <text x="1212" y="474" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#596275">IDs and deterministic</text>
