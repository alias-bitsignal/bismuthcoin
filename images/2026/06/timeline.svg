  <text x="60" y="110" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#596275">A compact web version of the 2017-2026 record described in the anniversary paper.</text>
  <line x1="110" y1="220" x2="1290" y2="220" stroke="#d9e1ee" stroke-width="8" stroke-linecap="round"/>

