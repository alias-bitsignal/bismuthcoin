  <text x="475" y="465" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#b364c2">Confidential assets</text>
  <text x="860" y="465" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#596275">Privacy at the asset layer</text>

  <rect x="60" y="492" width="1280" height="70" fill="#ffffff"/>
  <rect x="60" y="492" width="8" height="70" fill="#5fa1ee"/>
