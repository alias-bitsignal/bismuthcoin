  <text x="475" y="325" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#b364c2">Modular execution / DA layers</text>
  <text x="860" y="325" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#596275">Consensus over data separated from execution</text>

