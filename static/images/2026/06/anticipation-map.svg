  <text x="475" y="675" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#5fa1ee">Multi-chain interoperability</text>
  <text x="860" y="675" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#596275">BIS connected to ETH and BSC ecosystems</text>
