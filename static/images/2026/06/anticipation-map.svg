  <text x="60" y="110" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#596275">A promotional map from documented Bismuth artifacts to later mainstream categories.</text>
  <rect x="60" y="150" width="1280" height="560" rx="24" fill="#ffffff" stroke="#d9e1ee"/>
  <rect x="60" y="150" width="1280" height="62" rx="24" fill="#182033"/>
  <text x="95" y="190" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">Bismuth artifact</text>
  <text x="475" y="190" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">Later mainstream name</text>
  <text x="860" y="190" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">Why it matters</text>

  <rect x="60" y="212" width="1280" height="70" fill="#ffffff"/>
  <rect x="60" y="212" width="8" height="70" fill="#5fa1ee"/>
