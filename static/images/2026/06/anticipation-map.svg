  <text x="475" y="255" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#5fa1ee">Inscriptions + indexers</text>
  <text x="860" y="255" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#596275">Data on-chain, meaning interpreted above it</text>

  <rect x="60" y="282" width="1280" height="70" fill="#f2f5fa"/>
  <rect x="60" y="282" width="8" height="70" fill="#b364c2"/>
