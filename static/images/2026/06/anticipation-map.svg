  <text x="860" y="395" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#596275">Tokens, aliases, DNS, social, events, state channels</text>

  <rect x="60" y="422" width="1280" height="70" fill="#f2f5fa"/>
  <rect x="60" y="422" width="8" height="70" fill="#b364c2"/>
